<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子喷泉 Particle Fountain — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.pf{width:100%;height:100%}
</style>
</head>
<body>
  <canvas class="pf"></canvas>
<script>const c=document.querySelector('.pf');const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=[];(function tick(){ctx.fillStyle='rgba(15,16,35,0.08)';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<4;i++)ps.push({x:c.width/2+(Math.random()-0.5)*40,y:c.height,vx:(Math.random()-0.5)*2,vy:Math.random()*-9,g:0.15,c:`hsl(${Math.random()*360} 80% 60%)`});for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,2,2);if(p.y>c.height)ps.splice(i,1);}requestAnimationFrame(tick);})();</script>
</body>
</html>
