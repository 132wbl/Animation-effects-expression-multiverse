<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正弦波 Sine Wave — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.wave{width:100%;height:100%}
</style>
</head>
<body>
  <canvas class="wave"></canvas>
<script>const c=document.querySelector('.wave');const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let t=0;(function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#22d3ee';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<c.width;x++){const y=c.height/2+Math.sin(x*0.01+t)*60;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();t+=0.05;requestAnimationFrame(draw);})();</script>
</body>
</html>
