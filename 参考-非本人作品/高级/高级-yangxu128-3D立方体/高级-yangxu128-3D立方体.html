<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D立方体 3D Cube — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.cube-wrap{perspective:600px;width:110px;height:110px}.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cubeRot var(--duration,5s) linear infinite}.cube .face{position:absolute;width:110px;height:110px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;background:hsl(280 90% 60%);border:2px solid #fff;box-sizing:border-box;opacity:0.85}.cube .f2{transform:rotateY(180deg);background:hsl(0 90% 60%)}.cube .f3{transform:rotateY(90deg) translateZ(55px);background:hsl(60 90% 60%)}.cube .f4{transform:rotateY(-90deg) translateZ(55px);background:hsl(120 80% 55%)}.cube .f5{transform:rotateX(90deg) translateZ(55px);background:hsl(200 90% 60%)}.cube .f6{transform:rotateX(-90deg) translateZ(55px);background:hsl(320 80% 60%)}.cube .f1{transform:translateZ(55px)}@keyframes cubeRot{to{transform:rotateY(360deg) rotateX(360deg)}}
</style>
</head>
<body>
  <div class="cube-wrap"><div class="cube"><div class="face f1">1</div><div class="face f2">2</div><div class="face f3">3</div><div class="face f4">4</div><div class="face f5">5</div><div class="face f6">6</div></div></div>

</body>
</html>
