<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重力小球 Gravity Physics — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.grav{width:100%;height:100%}
</style>
</head>
<body>
  <canvas class="grav"></canvas>
<script>const c=document.querySelector('.grav');const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const balls=[];for(let i=0;i<8;i++)balls.push({x:Math.random()*c.width,y:50,vx:(Math.random()-0.5)*4,vy:0,r:12+Math.random()*8,c:`hsl(${Math.random()*360} 90% 60%)`});(function tick(){ctx.fillStyle='rgba(15,16,35,0.1)';ctx.fillRect(0,0,c.width,c.height);balls.forEach(b=>{b.vy+=0.4;b.x+=b.vx;b.y+=b.vy;if(b.y+b.r>c.height){b.y=c.height-b.r;b.vy*=-0.8;}if(b.x<b.r||b.x>c.width-b.r)b.vx*=-1;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();});requestAnimationFrame(tick);})();</script>
</body>
</html>
