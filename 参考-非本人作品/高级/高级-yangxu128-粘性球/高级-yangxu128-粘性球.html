<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粘性球 Metaball — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.mb{position:relative;width:100%;height:100%;background:#0a0a1a;overflow:hidden}.mb .ball{position:absolute;border-radius:50%;filter:blur(28px);will-change:transform}
</style>
</head>
<body>
  <div class="mb" id="mb"></div>
<script>const mb=document.getElementById('mb');const balls=[];for(let i=0;i<6;i++){const b=document.createElement('div');b.className='ball';b.style.width=b.style.height=(60+Math.random()*40)+'px';b.style.background=i%2?'hsl(280 90% 60%)':'hsl(180 90% 55%)';mb.appendChild(b);balls.push({el:b,x:Math.random()*mb.offsetWidth,y:Math.random()*mb.offsetHeight,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2});}(function tick(){balls.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>mb.offsetWidth-80)b.vx*=-1;if(b.y<0||b.y>mb.offsetHeight-80)b.vy*=-1;b.el.style.transform=`translate(${b.x}px,${b.y}px)`;});requestAnimationFrame(tick);})();</script>
</body>
</html>
