<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频条 Audio Wave — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.audio{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;height:100%}.audio .bar{width:8px;background:linear-gradient(180deg,hsl(280 90% 60%),hsl(200 90% 60%));border-radius:3px}
</style>
</head>
<body>
  <div class="audio" id="audio"></div>
<script>const wrap=document.getElementById('audio');const bars=[];for(let i=0;i<32;i++){const b=document.createElement('div');b.className='bar';wrap.appendChild(b);bars.push(b);}let t=0;(function tick(){t+=0.1;bars.forEach((b,i)=>{const h=20+Math.abs(Math.sin(t+i*0.4))*80;b.style.height=h+'%';});requestAnimationFrame(tick);})();</script>
</body>
</html>
