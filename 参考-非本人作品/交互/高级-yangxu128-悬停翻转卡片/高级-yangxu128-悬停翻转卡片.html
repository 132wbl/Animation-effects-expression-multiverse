<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬停翻转卡片 Hover Flip Card — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.card{width:200px;height:280px;perspective:800px;cursor:pointer}.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform var(--duration,0.7s)}.card:hover .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:16px;font-weight:900;font-size:28px}.front{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}.back{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;transform:rotateY(180deg)}
</style>
</head>
<body>
  <div class="card"><div class="card-inner"><div class="face front">正面</div><div class="face back">背面</div></div></div>

</body>
</html>
