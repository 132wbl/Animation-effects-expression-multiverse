<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬停发光 Hover Glow — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.glow-btn{width:200px;height:60px;background:#0f1023;border:2px solid #22d3ee;color:#22d3ee;border-radius:30px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;transition:all var(--duration,0.3s)}.glow-btn:hover{box-shadow:0 0 30px #22d3ee,inset 0 0 20px rgba(34,211,238,0.3);color:#fff;transform:scale(1.05)}
</style>
</head>
<body>
  <div class="glow-btn">Glow</div>

</body>
</html>
