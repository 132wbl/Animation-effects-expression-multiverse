<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渐变文字 Gradient Text — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
.grad-text{font-size:56px;font-weight:900;background:linear-gradient(90deg,#f97316,#e879f9,#22d3ee,#f97316);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradText var(--duration,4s) linear infinite}@keyframes gradText{to{background-position:300% 100%}}
</style>
</head>
<body>
  <div class="grad-text">Gradient</div>

</body>
</html>
