<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉冲 Pulse — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 40px; }
  .pulse{animation:pulse var(--duration,1.5s) ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(calc(1 + var(--intensity,0.15)))}}
</style>
</head>
<body>
  <!-- 可调参数：style="--duration:1.5s; --intensity:0.15" -->
  <div class="pulse">&#9679;</div>
</body>
</html>
