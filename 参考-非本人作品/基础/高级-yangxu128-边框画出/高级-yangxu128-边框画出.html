<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边框画出 Border Draw — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 40px; }
  .border-draw{position:relative;padding:20px 44px;font-weight:900;font-size:28px}.border-draw::before{content:'';position:absolute;inset:0;border:3px solid var(--accent,#6366f1);animation:borderDraw var(--duration,2s) linear infinite}@keyframes borderDraw{0%{clip-path:inset(0 100% 0 0)}25%{clip-path:inset(0 0 0 0)}50%{clip-path:inset(0 0 100% 0)}75%{clip-path:inset(100% 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
</style>
</head>
<body>
  <!-- 可调参数：style="--duration:2s" -->
  <div class="border-draw">DRAW</div>
</body>
</html>
