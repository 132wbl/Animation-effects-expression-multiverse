<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>右侧滑入 Slide In Right — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 40px; }
  .slide-right{animation:slideRight var(--duration,0.6s) ease-out both}@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
</style>
</head>
<body>
  <!-- 可调参数：style="--duration:0.6s" -->
  <div class="slide-right">&larr;</div>
</body>
</html>
