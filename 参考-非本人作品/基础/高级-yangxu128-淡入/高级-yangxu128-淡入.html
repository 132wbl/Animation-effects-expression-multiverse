<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淡入 Fade In — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 40px; }
  .fade-in{animation:fadeIn var(--duration,0.8s) ease-out var(--delay,0s) both}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
  <!-- 可调参数：style="--duration:0.8s; --delay:0s" -->
  <div class="fade-in">Hello</div>
</body>
</html>
