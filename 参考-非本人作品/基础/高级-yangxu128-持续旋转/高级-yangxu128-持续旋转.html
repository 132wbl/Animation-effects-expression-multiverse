<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持续旋转 Rotate 360 — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 40px; }
  .rotate-360{animation:rotate360 var(--duration,3s) linear infinite}@keyframes rotate360{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <!-- 可调参数：style="--duration:3s" -->
  <div class="rotate-360">&#10263;</div>
</body>
</html>
