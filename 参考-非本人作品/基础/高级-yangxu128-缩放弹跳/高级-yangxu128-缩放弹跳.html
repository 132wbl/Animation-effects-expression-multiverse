<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缩放弹跳 Zoom Bounce — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 40px; }
  .zoom-bounce{animation:zoomBounce var(--duration,0.8s) cubic-bezier(0.34,1.56,0.64,1) both}@keyframes zoomBounce{from{transform:scale(0)}to{transform:scale(1)}}
</style>
</head>
<body>
  <!-- 可调参数：style="--duration:0.8s" -->
  <div class="zoom-bounce">&#9679;</div>
</body>
</html>
