<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旋转入场 Rotate In — Motion.Lab 自研动效库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1023; color: #fff; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 40px; }
  .rotate-in{animation:rotateIn var(--duration,0.7s) ease-out both}@keyframes rotateIn{from{transform:rotate(-180deg) scale(0.3);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
</style>
</head>
<body>
  <!-- 可调参数：style="--duration:0.7s" -->
  <div class="rotate-in">&#9733;</div>
</body>
</html>
