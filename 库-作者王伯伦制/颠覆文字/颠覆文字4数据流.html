<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颠覆文字 ④ — 数据流 · 王伯伦原创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: radial-gradient(circle at 50% 40%, #04150f, #02080a 82%);
    font-family: "Consolas", monospace; overflow: hidden;
  }
  canvas { display: block; }
  .meta { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: rgba(90,220,160,0.5); z-index: 5;
    background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 20px; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="meta">颠覆文字 ④ · 数据流</div>

<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W, H;
  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  const TEXT = '流逝';
  const STEP = 12;

  // 采样字形：返回字形内各采样点坐标
  function sampleGlyph(){
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d');
    octx.fillStyle = '#fff';
    octx.font = `900 ${Math.min(W,H)*0.3}px "Microsoft YaHei", "SimHei", sans-serif`;
    octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.fillText(TEXT, W/2, H/2);
    const img = octx.getImageData(0,0,W,H).data;
    const pts = [];
    for (let y=0; y<H; y+=STEP) for (let x=0; x<W; x+=STEP){
      if (img[(y*W+x)*4+3] > 90) pts.push({ x: x+STEP/2, y: y+STEP/2, ch: randChar(), cy: Math.random()*40 });
    }
    return pts;
  }

  const CHARS = '0123456789ABCDEF';
  function randChar(){ return CHARS[Math.floor(Math.random()*CHARS.length)]; }

  let cells = sampleGlyph();
  // 每个字符有自己的更新节奏
  function frame(){
    ctx.fillStyle = 'rgba(2,8,10,0.16)';
    ctx.fillRect(0,0,W,H);

    for (const c of cells){
      // 滚动更新字符（模拟数据流动）
      if (Math.random() < 0.08) c.ch = randChar();
      const size = 11;
      ctx.font = `${size}px Consolas, monospace`;
      const g = ctx.createLinearGradient(c.x, c.y-size, c.x, c.y);
      g.addColorStop(0, 'rgba(120,255,190,0.0)');
      g.addColorStop(1, 'rgba(120,255,190,0.95)');
      ctx.fillStyle = g;
      ctx.fillText(c.ch, c.x, c.y);
    }
    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
