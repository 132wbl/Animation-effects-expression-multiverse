<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颠覆文字 ③ — 水面倒影 · 王伯伦原创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: linear-gradient(180deg, #0a0e16 0%, #0e1a26 55%, #0c141f 100%);
    font-family: "KaiTi", "STKaiti", "SimSun", "Noto Serif SC", serif;
    overflow: hidden;
  }
  .stage { text-align: center; }

  /* 正字 */
  .main-word { font-size: 120px; font-weight: 400; letter-spacing: 12px; color: #dbe8f2; text-shadow: 0 4px 24px rgba(120,190,230,0.35); }

  /* 水面线 */
  .waterline { margin: 4px auto 0; width: 320px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(120,200,240,0.5), transparent);
    border-radius: 2px; position: relative; }

  /* 倒影：翻转 + 模糊 + 波动 */
  .reflection {
    margin-top: 0; font-size: 120px; font-weight: 400; letter-spacing: 12px;
    color: rgba(120,190,230,0.45);
    transform: scaleY(-1);
    transform-origin: top;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.5), transparent 75%);
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.5), transparent 75%);
    filter: blur(1px);
  }
  .reflection .r {
    display: inline-block;
    animation: ripple 3.2s ease-in-out infinite;
  }
  .reflection .r:nth-child(1){ animation-delay: 0s; }
  .reflection .r:nth-child(2){ animation-delay: 0.4s; }
  .reflection .r:nth-child(3){ animation-delay: 0.8s; }
  .reflection .r:nth-child(4){ animation-delay: 1.2s; }
  @keyframes ripple {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  .sub { margin-top: 26px; font-size: 14px; letter-spacing: 5px; color: rgba(150,190,215,0.45); font-family: system-ui, sans-serif; }

  .meta { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: rgba(180,215,235,0.4); background: rgba(0,0,0,0.35);
    padding: 5px 16px; border-radius: 20px; font-family: system-ui, sans-serif; }
</style>
</head>
<body>

  <div class="stage">
    <div class="main-word">月</div>
    <div class="waterline"></div>
    <div class="reflection"><span class="r">月</span></div>
    <div class="sub">倒影 · 水中月</div>
  </div>

  <div class="meta">颠覆文字 ③ · 水面倒影</div>

<script>
  // 预留：可改字（同步改 .main-word 和 .reflection 的字）
</script>
</body>
</html>
