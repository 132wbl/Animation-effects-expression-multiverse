<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字动效 M — 墨迹晕开 · 王伯伦原创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: #f2ead8;   /* 宣纸米色 */
    font-family: "KaiTi", "STKaiti", "SimSun", "Noto Serif SC", serif;
    overflow: hidden;
  }
  .stage { text-align: center; }

  /* 墨迹文字：透明底，由"墨晕"背景填充成字 */
  .ink {
    font-size: 110px; font-weight: 400; letter-spacing: 12px;
    color: transparent; -webkit-text-fill-color: transparent;
    background-image: radial-gradient(circle at 50% 50%, #2a251f 28%, rgba(42,37,31,0.7) 55%, rgba(42,37,31,0.15) 78%, transparent 85%);
    background-repeat: no-repeat;
    background-position: center;
    background-size: 14% 14%;              /* 初始：中心一小团墨 */
    -webkit-background-clip: text; background-clip: text;
    animation: inkSpread 5s cubic-bezier(0.55,0,0.25,1) infinite;
    text-shadow: 0 6px 26px rgba(80,70,50,0.12);
    padding: 8px 6px;
  }
  /* 墨团从中心向外晕开，把整行字"染"出来 */
  @keyframes inkSpread {
    0%   { background-size: 12% 12%; filter: blur(6px); }
    12%  { background-size: 60% 34%; filter: blur(3px); }   /* 墨快速展开 */
    45%  { background-size: 240% 240%; filter: blur(0); }   /* 铺满成字 */
    72%  { background-size: 240% 240%; filter: blur(0); }   /* 停留，字清晰 */
    88%  { background-size: 200% 160%; filter: blur(0); opacity: 0.9; }
    100% { background-size: 12% 12%; filter: blur(8px); opacity: 0.15; } /* 墨收拢淡去 */
  }

  .sub { margin-top: 30px; font-size: 15px; letter-spacing: 6px; color: #8a8272; font-family: system-ui, sans-serif; }

  .meta { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: #a89f8c; background: rgba(255,255,255,0.6);
    padding: 5px 16px; border-radius: 20px; font-family: system-ui, sans-serif; }
</style>
</head>
<body>

  <div class="stage">
    <span class="ink">墨韵</span>
    <div class="sub">墨滴入水 · 晕染成形</div>
  </div>

  <div class="meta">文字动效 M · 墨迹晕开</div>

<script>
  // 预留：可改文字（改 .ink 里的字即可，多字时 background-size 起始值需调大）
</script>
</body>
</html>
