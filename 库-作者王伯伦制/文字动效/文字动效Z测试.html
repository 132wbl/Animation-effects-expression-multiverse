<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>文字动效 Z 测试 · 王伯伦原创</title>
<style>
  html,body{margin:0;height:100%;background:#080b11;display:flex;align-items:center;justify-content:center}
  .dot{width:12px;height:12px;border-radius:50%;background:#7df9ff;animation:run 2.4s ease-in-out infinite}
  @keyframes run{0%,100%{transform:translateX(-120px)}50%{transform:translateX(120px)}}
</style>
</head>
<body><div class="dot"></div></body>
</html>
