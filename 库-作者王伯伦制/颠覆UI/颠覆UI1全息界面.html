<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颠覆UI ① — 全息界面 · 王伯伦原创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: radial-gradient(circle at 50% 40%, #020a14, #01040a 85%);
    font-family: "Consolas", "Courier New", monospace; color: #22d3ee; overflow: hidden;
  }

  /* 透视网格底 */
  .grid-bg { position: fixed; inset: 0; perspective: 400px; overflow: hidden; opacity: 0.25; }
  .grid-bg::before { content:''; position: absolute; left:-20%; right:-20%; bottom:-30%; top:0;
    background-image: linear-gradient(rgba(34,211,238,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.4) 1px, transparent 1px);
    background-size: 46px 46px; transform: rotateX(70deg); transform-origin: bottom; }

  /* 全息面板 */
  .holo {
    position: relative; width: 460px; min-height: 320px;
    border: 1px solid rgba(34,211,238,0.5); border-radius: 14px;
    background: linear-gradient(160deg, rgba(34,211,238,0.06), rgba(34,211,238,0.02));
    box-shadow: 0 0 30px rgba(34,211,238,0.15), inset 0 0 30px rgba(34,211,238,0.08);
    backdrop-filter: blur(2px);
    padding: 26px;
    animation: floaty 5s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* 扫描线 */
  .holo::after { content:''; position: absolute; left:0; right:0; height: 60px;
    background: linear-gradient(180deg, transparent, rgba(34,211,238,0.12), transparent);
    animation: scan 3.2s linear infinite; }
  @keyframes scan { 0%{top:-60px} 100%{top:100%} }

  /* 角落标点 */
  .corner { position: absolute; width: 12px; height: 12px; }
  .corner.tl{ top:-1px; left:-1px; border-top:2px solid #22d3ee; border-left:2px solid #22d3ee; }
  .corner.tr{ top:-1px; right:-1px; border-top:2px solid #22d3ee; border-right:2px solid #22d3ee; }
  .corner.bl{ bottom:-1px; left:-1px; border-bottom:2px solid #22d3ee; border-left:2px solid #22d3ee; }
  .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid #22d3ee; border-right:2px solid #22d3ee; }

  .h-title { font-size: 15px; letter-spacing: 4px; color: rgba(34,211,238,0.9); margin-bottom: 20px; }
  .h-title::before { content:'▸ '; }

  /* 数据行 */
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0;
    border-bottom: 1px dashed rgba(34,211,238,0.2); }
  .row .k { color: rgba(34,211,238,0.6); font-size: 13px; letter-spacing: 1px; }
  .row .v { font-size: 15px; color: #7df3ff; }
  .row .v em { font-style: normal; animation: blink 1s steps(2) infinite; }

  /* 悬浮数据点 */
  .datum { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #22d3ee;
    box-shadow: 0 0 8px #22d3ee; animation: blink 2s infinite; }
  .datum.d1{ top:30px; right:40px; } .datum.d2{ top:60px; right:90px; animation-delay:0.3s; }
  .datum.d3{ top:50px; right:150px; animation-delay:0.6s; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

  .note { margin-top: 20px; font-size: 12px; color: rgba(34,211,238,0.45); letter-spacing: 1px; }

  .meta { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: rgba(34,211,238,0.5); background: rgba(0,0,0,0.4);
    padding: 5px 16px; border-radius: 20px; }
</style>
</head>
<body>

  <div class="grid-bg"></div>

  <div class="holo">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <span class="datum d1"></span><span class="datum d2"></span><span class="datum d3"></span>

    <div class="h-title">SYSTEM / 全息终端</div>

    <div class="row"><span class="k">STATUS</span><span class="v">ONLINE <em>▮</em></span></div>
    <div class="row"><span class="k">LATENCY</span><span class="v">23 ms</span></div>
    <div class="row"><span class="k">UPTIME</span><span class="v">14:22:09</span></div>
    <div class="row"><span class="k">NODES</span><span class="v">1,284</span></div>
    <div class="row"><span class="k">PROTOCOL</span><span class="v">HOLO·v3</span></div>

    <div class="note">▸ 全息投影 · 数据实时悬浮</div>
  </div>

  <div class="meta">颠覆UI ① · 全息界面</div>

<script>
  // 实时跳动 uptime
  const uptimeEl = document.querySelector('.row .v');
  // 预留：可改为真实计时
</script>
</body>
</html>
