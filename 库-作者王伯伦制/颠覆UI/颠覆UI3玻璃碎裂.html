<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颠覆UI ③ — 玻璃碎裂 · 王伯伦原创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: radial-gradient(circle at 50% 40%, #10151d, #05070c 85%);
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff; overflow: hidden;
  }
  .stage { text-align: center; }
  .hint { font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,0.4); margin-bottom: 26px; }

  /* 玻璃卡片容器 */
  .glass-wrap { position: relative; width: 400px; height: 250px; cursor: pointer; perspective: 600px; }

  /* 完整玻璃 */
  .glass {
    position: absolute; inset: 0; border-radius: 20px;
    background: linear-gradient(150deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04) 60%);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 300; letter-spacing: 6px; color: rgba(255,255,255,0.75);
    overflow: hidden;
    transition: transform 0.4s ease;
  }
  /* 玻璃反光斜带 */
  .glass::before { content:''; position:absolute; top:-20%; bottom:-20%; left:-40%; width:40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.18), transparent);
    transform: skewX(-18deg); animation: glint 4s ease-in-out infinite; }
  @keyframes glint { 0%,100%{left:-40%} 50%{left:120%} }

  /* 裂纹 SVG 层 */
  .cracks { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .cracks svg { width: 100%; height: 100%; }
  .cracks path { stroke: rgba(255,255,255,0.7); stroke-width: 1.5; fill: none;
    stroke-dasharray: 8 3; opacity: 0; }
  .glass-wrap.broken .cracks { opacity: 1; }
  .glass-wrap.broken .cracks path { animation: crackFlash 0.5s linear forwards; }
  @keyframes crackFlash { from { opacity: 1; } to { opacity: 0; } }

  /* 碎片 */
  .shard { position: absolute; opacity: 0; border-radius: 4px;
    background: linear-gradient(150deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
    border: 1px solid rgba(255,255,255,0.25); }
  .glass-wrap.broken .shard { animation: shatter 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards; }
  @keyframes shatter {
    0%{ opacity: 1; transform: translate(0,0) rotate(0); }
    100%{ opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--dr)) scale(0.8); }
  }

  /* 文字在碎片层上方 */
  .glass-label { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    font-size:30px; letter-spacing:6px; color: rgba(255,255,255,0.75); pointer-events:none; z-index:3; }
  .glass-wrap.broken .glass-label { opacity: 0; transition: opacity 0.2s; }

  .meta { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.35); background: rgba(0,0,0,0.4);
    padding: 5px 16px; border-radius: 20px; }
</style>
</head>
<body>

  <div class="stage">
    <div class="hint">点击玻璃 · 看它碎裂</div>
    <div class="glass-wrap" id="gw">
      <div class="glass" id="glass"><span class="glass-label">轻轻一碰</span></div>
      <div class="cracks" id="cracks"></div>
    </div>
  </div>

  <div class="meta">颠覆UI ③ · 玻璃碎裂</div>

<script>
  const gw = document.getElementById('gw');
  const glass = document.getElementById('glass');
  const cracks = document.getElementById('cracks');

  // 生成碎片（6块）
  function buildShards(){
    const W = gw.offsetWidth, H = gw.offsetHeight;
    const specs = [
      { x:0, y:0, w:W*0.55, h:H*0.55, dx:-90, dy:-40, dr:-14 },
      { x:W*0.55, y:0, w:W*0.45, h:H*0.5, dx:80, dy:-30, dr:12 },
      { x:0, y:H*0.55, w:W*0.5, h:H*0.45, dx:-70, dy:50, dr:16 },
      { x:W*0.5, y:H*0.5, w:W*0.3, h:H*0.28, dx:40, dy:-60, dr:-10 },
      { x:W*0.3, y:H*0.75, w:W*0.4, h:H*0.25, dx:-30, dy:80, dr:-18 },
      { x:W*0.7, y:H*0.55, w:W*0.3, h:H*0.45, dx:90, dy:60, dr:14 }
    ];
    specs.forEach(s => {
      const d = document.createElement('div');
      d.className = 'shard';
      d.style.cssText = `left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px;--dx:${s.dx}px;--dy:${s.dy}px;--dr:${s.dr}deg;`;
      gw.appendChild(d);
    });
  }

  // 生成裂纹（从中心放射）
  function buildCracks(){
    const W = gw.offsetWidth, H = gw.offsetHeight;
    const cx = W/2, cy = H/2;
    const lines = [];
    for (let i=0;i<10;i++){
      const a = (Math.PI*2/10)*i + Math.random()*0.4;
      const r = Math.min(W,H)*0.45;
      const x2 = cx + Math.cos(a)*r, y2 = cy + Math.sin(a)*r;
      // 中间折一次
      const mx = cx + Math.cos(a)*r*0.5 + Math.cos(a+0.5)*r*0.15;
      const my = cy + Math.sin(a)*r*0.5 + Math.sin(a+0.5)*r*0.15;
      lines.push(`M${cx},${cy} L${mx},${my} L${x2},${y2}`);
    }
    cracks.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${lines.map(d=>`<path d="${d}"/>`).join('')}</svg>`;
  }

  buildShards(); buildCracks();
  const shards = gw.querySelectorAll('.shard');

  function reset(){
    gw.classList.remove('broken');
    shards.forEach(s=>{ s.style.opacity=0; });
    glass.style.opacity = 1;
  }

  gw.addEventListener('click', () => {
    if (gw.classList.contains('broken')) { reset(); return; }
    gw.classList.add('broken');
    glass.style.opacity = 0.3;
    setTimeout(reset, 1200);
  });
</script>
</body>
</html>
