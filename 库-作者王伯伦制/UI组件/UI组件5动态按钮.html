<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI组件 ⑤ — 动态按钮 · 王伯伦原创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: #0d1117;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
  }
  .stage { max-width: 640px; text-align: center; }

  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; margin: 18px 0; }

  button {
    position: relative; overflow: hidden;
    border: none; cursor: pointer;
    font-size: 16px; font-weight: 600; letter-spacing: 1px;
    padding: 14px 30px; border-radius: 10px;
    color: #fff; background: transparent;
    transition: all 0.3s ease;
  }

  /* 1 发光按钮：悬停外发光 */
  .btn-glow { background: #3b82f6; }
  .btn-glow:hover { box-shadow: 0 0 22px rgba(59,130,246,0.8), 0 0 60px rgba(59,130,246,0.4); transform: translateY(-2px); }

  /* 2 涟漪按钮：点击水波扩散 */
  .btn-ripple { background: #10b981; }
  .btn-ripple::after { content: ''; position: absolute; left:50%; top:50%; width:0; height:0; border-radius:50%;
    background: rgba(255,255,255,0.5); transform: translate(-50%,-50%); opacity:0; }
  .btn-ripple:active::after { animation: ripple 0.6s ease-out; }
  @keyframes ripple { to { width: 300px; height: 300px; opacity: 0; } }

  /* 3 扫光按钮：悬停一束光扫过 */
  .btn-shine { background: linear-gradient(90deg,#8b5cf6,#6d28d9); }
  .btn-shine::before { content: ''; position:absolute; top:0; bottom:0; left:-120%; width:60%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); transform: skewX(-20deg); }
  .btn-shine:hover::before { animation: shine 0.9s ease; }
  @keyframes shine { to { left: 120%; } }

  /* 4 变形按钮：悬停轻微放大+圆角变化 */
  .btn-morph { background: #ef4444; border-radius: 10px; }
  .btn-morph:hover { border-radius: 26px; transform: scale(1.08); }

  /* 5 描边按钮：悬停填充 */
  .btn-stroke { border: 2px solid #f59e0b; color: #f59e0b; background: transparent; }
  .btn-stroke:hover { background: #f59e0b; color: #1a1a1a; box-shadow: 0 0 20px rgba(245,158,11,0.4); }

  /* 6 浮动按钮：悬停上浮带投影 */
  .btn-float { background: #06b6d4; }
  .btn-float:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(6,182,212,0.35); }

  .title { font-size: 13px; letter-spacing: 4px; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
  .title small { color: rgba(255,255,255,0.3); }

  .meta { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.35); background: rgba(0,0,0,0.4);
    padding: 5px 16px; border-radius: 20px; }
</style>
</head>
<body>

  <div class="stage">
    <div class="title">UI组件 ⑤ · 动态按钮 <small>—— 悬停 / 点击看效果</small></div>

    <div class="row">
      <button class="btn-glow">发光</button>
      <button class="btn-ripple">涟漪</button>
      <button class="btn-shine">扫光</button>
    </div>
    <div class="row">
      <button class="btn-morph">变形</button>
      <button class="btn-stroke">描边</button>
      <button class="btn-float">浮动</button>
    </div>
  </div>

  <div class="meta">UI组件 ⑤ · 动态按钮</div>

</body>
</html>
