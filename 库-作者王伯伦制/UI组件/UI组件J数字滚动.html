<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI组件 J — 数字滚动·翻牌 · 王伯伦原创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: radial-gradient(circle at 50% 40%, #0c1220, #05070c 82%);
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
  }
  .stage { text-align: center; }
  .title { font-size: 13px; letter-spacing: 4px; color: rgba(255,255,255,0.5); margin-bottom: 10px; }

  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }
  .card {
    width: 260px; min-height: 170px; border-radius: 16px;
    background: linear-gradient(180deg, #141c2c, #0d1420); border: 1px solid #243047;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 20px;
  }
  .card .unit { font-size: 15px; color: rgba(255,255,255,0.4); letter-spacing: 2px; }
  .card .cap { font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }

  /* 翻牌数字：每位是机械计分器翻牌，颜色跟随卡片 */
  .flip { display: flex; gap: 3px; align-items: center; }
  .flip .cell { position: relative; width: 34px; height: 54px; perspective: 320px; }
  .flip .cell.top-half, .flip .cell.bot-half { position: absolute; left:0; right:0; height:50%; overflow:hidden; }
  .flip .cell.top-half { top:0; }
  .flip .cell.bot-half { bottom:0; }
  .flip .cell .t, .flip .cell .b { position:absolute; left:0; right:0; height:54px; display:flex; align-items:center; justify-content:center;
    font-size: 38px; font-weight: 800; }
  .flip .cell .t { top:0; }
  .flip .cell .b { bottom:0; }
  .flip .cell .t::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background: rgba(0,0,0,0.35); }
  .flip .cell.flip .t { animation: tFlip 0.45s ease-in; }
  .flip .cell.flip .b { animation: bFlip 0.45s ease-out; }
  @keyframes tFlip { from { transform: rotateX(0); } to { transform: rotateX(-90deg); } }
  @keyframes bFlip { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }
  /* 数字色 + 翻牌底 */
  .flip .cell { background: #1a2440; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04); }
  .flip .cell .t, .flip .cell .b { color: var(--c, #22d3ee); text-shadow: 0 0 14px var(--c, #22d3ee); }
  .flip .dot { font-size: 38px; font-weight: 800; color: var(--c, #22d3ee); text-shadow: 0 0 14px var(--c, #22d3ee); padding: 0 2px; }

  /* 达成闪光 */
  .card.flash .numwrap { animation: numFlash 0.5s ease-out; }
  @keyframes numFlash { 0%{filter:brightness(1)} 30%{filter:brightness(2.2) drop-shadow(0 0 16px var(--c, #22d3ee))} 100%{filter:brightness(1)} }

  /* 变体配色 */
  .card.pink { --c: #f0abfc; }
  .card.gold { --c: #fbbf24; }
  .card.green { --c: #34d399; }
  .card.red { --c: #fb7185; }

  .meta { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.35); background: rgba(0,0,0,0.4);
    padding: 5px 16px; border-radius: 20px; }
</style>
</head>
<body>

  <div class="stage">
    <div class="title">UI组件 J · 数字滚动·翻牌</div>

    <div class="grid">
      <div class="card" data-target="12847"><div class="numwrap"><div class="flip"></div></div><div class="unit">用户</div><div class="cap">实时在线</div></div>
      <div class="card pink" data-target="963"><div class="numwrap"><div class="flip"></div></div><div class="unit">万</div><div class="cap">累计交易</div></div>
      <div class="card gold" data-target="99.9" data-dec="1"><div class="numwrap"><div class="flip"></div></div><div class="unit">%</div><div class="cap">可用率</div></div>
      <div class="card green" data-target="8734"><div class="numwrap"><div class="flip"></div></div><div class="unit">次</div><div class="cap">处理请求</div></div>
      <div class="card red" data-target="3200"><div class="numwrap"><div class="flip"></div></div><div class="unit">+</div><div class="cap">今日新增</div></div>
    </div>
  </div>

  <div class="meta">UI组件 J · 数字滚动·翻牌</div>

<script>
  // 数字滚动·翻牌：每位像机械计分器翻牌
  document.querySelectorAll('.card').forEach(card => {
    const target = parseFloat(card.dataset.target);
    const dec = parseInt(card.dataset.dec) || 0;
    const dur = 1800;
    const color = getComputedStyle(card).getPropertyValue('--c').trim() || '#22d3ee';
    const str = target.toFixed(dec);   // 如 "12847" 或 "99.9"
    const wrap = card.querySelector('.numwrap');
    const flip = card.querySelector('.flip');

    // 建立翻牌位（含小数点）
    const parts = str.split('');   // 每个字符一位
    parts.forEach(ch => {
      if (ch === '.') {
        const d = document.createElement('span');
        d.className = 'dot';
        d.textContent = '.';
        flip.appendChild(d);
      } else {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = `<div class="top-half"><span class="t">0</span></div><div class="bot-half"><span class="b">0</span></div>`;
        flip.appendChild(cell);
      }
    });
    const cells = [...flip.children].filter(el => el.classList.contains('cell'));

    // 只有数字位的索引（跳过小数点）
    const numChars = parts.filter(ch => ch !== '.');
    function setVal(real){
      const strv = real.toFixed(dec);
      const chars = strv.split('').filter(c => c !== '.');
      cells.forEach((cell, i) => {
        const ch = chars[i] || '0';
        const t = cell.querySelector('.t'), b = cell.querySelector('.b');
        if (t.textContent !== ch){
          cell.classList.remove('flip');
          void cell.offsetWidth;
          b.textContent = ch;
          cell.classList.add('flip');
          setTimeout(()=>{ t.textContent = ch; }, 220);
        }
      });
    }

    function run(){
      const start = performance.now();
      function step(now){
        const p = Math.min((now-start)/dur, 1);
        const eased = 1 - Math.pow(1-p, 3);
        setVal(target * eased);
        if (p < 1) requestAnimationFrame(step);
        else {
          card.classList.add('flash');
          setTimeout(()=>card.classList.remove('flash'), 600);
          setTimeout(()=>{ setVal(0); setTimeout(run, 500); }, 1700);
        }
      }
      requestAnimationFrame(step);
    }
    setTimeout(run, 300);
  });
</script>
</body>
</html>
