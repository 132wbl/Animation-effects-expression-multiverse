<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拼图时间 v2 · 时间是被拼出来的 · 王伯伦原创</title>
<!--
  拼图时间 v2 —— 王伯伦原创制作
  概念：时间不是被「显示」的，是被「拼」出来的。
  「13:26」这一整幅字，被切成 6×4 = 24 块拼图（24 块也正好是 24 小时）。
  平时它们随随便便散在桌上、各自慢慢漂、读不出任何字；
  指针移过来，24 块归位咬合，你才读出现在几点。
  v1 的错：拼图盘和时间牌是两套东西，各演各的。v2 只有一件东西。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 32%, #0b121a 0%, #05070d 58%, #02040a 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }

  .stage { position: relative; width: 1000px; height: 600px; transform-origin: 50% 50%; }

  /* 嵌到别人网页里时：#iframe 模式 —— 不要自己的黑底、不要签名、不要日期 */
  body.embed { background: none; }
  body.embed .meta, body.embed .tag { display: none; }

  /* 拼好的时候，字背后浮一层极淡的光 */
  .glow {
    position: absolute; left: 50%; top: 50%; width: 860px; height: 470px;
    transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
    background: radial-gradient(closest-side, rgba(96, 205, 255, 0.20), rgba(120, 110, 255, 0.08) 55%, transparent 76%);
    transition: opacity 1s ease-out;
  }
  .stage.open .glow { opacity: 1; }

  /* 拼图盘：不是盘子，是 24 块该待的位置 */
  .board { position: absolute; left: 50%; top: 50%; width: 720px; height: 300px; transform: translate(-50%, -50%); }
  .board .pc {
    position: absolute; background-repeat: no-repeat; border-radius: 3px;
    background-color: rgba(10, 16, 24, 0.84);   /* 自带暗玻璃底：嵌到别人任何底色上也立得住 */
    box-shadow: inset 0 0 0 1px var(--seam, rgba(255, 255, 255, 0.05)), inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 0 18px rgba(0, 0, 0, 0.55);
    will-change: transform;
  }

  /* 底部：一行日期 + 一句提示，别抢戏 */
  .meta {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    text-align: center; pointer-events: none; white-space: nowrap;
  }
  .meta .date { font-size: 12px; letter-spacing: 4px; color: rgba(214, 236, 255, 0.34); font-variant-numeric: tabular-nums; }
  .meta .hint {
    margin-top: 10px; font-size: 11px; letter-spacing: 3px; color: rgba(150, 172, 196, 0.5);
    transition: opacity 0.5s ease-out;
  }
  .meta .hint.off { display: none; }

  .tag { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 11px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.22); }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="board" id="board"></div>
  <div class="meta">
    <div class="date" id="date"></div>
    <div class="hint" id="hint">把指针移过来 · 才拼得成</div>
  </div>
</div>
<div class="tag">拼图时间 v2 · 王伯伦原创</div>

<script>
(function () {
  'use strict';

  /* ============ 基本量：6×4 = 24 块，24 块 = 24 小时 ============ */
  var COLS = 6, ROWS = 4, TOTAL = COLS * ROWS;
  var PW = 120, PH = 75;                 // 每块在盘上的尺寸
  var BW = COLS * PW, BH = ROWS * PH;    // 整幅 720 × 300

  var stage = document.getElementById('stage');
  var board = document.getElementById('board');
  var dateEl = document.getElementById('date');
  var hintEl = document.getElementById('hint');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hash = location.hash;
  var forceOpen = hash.indexOf('demo') > -1;   // 验收用：地址后加 #demo 直接看拼好的样子
  var embedMode = hash.indexOf('iframe') > -1; // 嵌入用：地址后加 #iframe → 透明底、去掉日期与签名

  /* ============ 把此刻的字画成一张图，再切成 24 块 ============ */
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var cv = document.createElement('canvas');
  cv.width = BW * DPR;
  cv.height = BH * DPR;
  var ctx = cv.getContext('2d');
  var curKey = '';      // 已经画好的 HH:MM，没变就不重画

  /* 返回：新图 url + 这一分钟到底哪几块变了（变了的那几块要当场重新咬合一次） */
  function paint(hh, mm) {
    var key = hh + ':' + mm;
    if (key === curKey) return null;
    curKey = key;

    var text = hh + ':' + mm;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, BW, BH);

    /* 每个数字都占一样的格宽（拿「8」的宽度当标准），换数字时整排不会左右跳 */
    var font = function (s) { return '900 ' + s + 'px "Segoe UI", "Microsoft YaHei", Arial, sans-serif'; };
    var size = 300, refW, colW, total;
    ctx.font = font(size);
    refW = ctx.measureText('8').width;
    colW = ctx.measureText(':').width;
    total = refW * 4 + colW;
    var kFit = Math.min(1, (BW - 40) / total, (BH - 30) / (size * 0.74));
    size = Math.floor(size * kFit);
    ctx.font = font(size);
    refW = ctx.measureText('8').width;
    colW = ctx.measureText(':').width;
    total = refW * 4 + colW;

    var gr = ctx.createLinearGradient(0, 0, BW, BH);
    gr.addColorStop(0.00, '#c8f4ff');
    gr.addColorStop(0.34, '#ffffff');
    gr.addColorStop(0.66, '#e6dcff');
    gr.addColorStop(1.00, '#9fd6ff');

    ctx.fillStyle = gr;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    var cxp = BW / 2 - total / 2;
    var chs = text.split('');
    for (var ci3 = 0; ci3 < chs.length; ci3++) {
      var adv = chs[ci3] === ':' ? colW : refW;
      var mid = cxp + adv / 2;
      ctx.shadowColor = 'rgba(118, 214, 255, 0.60)';
      ctx.shadowBlur = 30;
      ctx.fillText(chs[ci3], mid, BH / 2 + 2);
      /* 再描一遍，让笔画边缘结一点点（切片后缝更利） */
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.55;
      ctx.fillText(chs[ci3], mid, BH / 2 + 2);
      ctx.globalAlpha = 1;
      cxp += adv;
    }

    var url = cv.toDataURL('image/png');

    /* 比一比：哪几块的笔画真的变了（只在这一分钟变的时候算一次） */
    var data = ctx.getImageData(0, 0, cv.width, cv.height).data;
    var changed = [];
    for (var q = 0; q < pieces.length; q++) {
      var pp = pieces[q];
      var x0 = pp.col * PW * DPR, y0 = pp.row * PH * DPR;
      var step = 14 * DPR, sum = 0;
      for (var yy = y0 + 6; yy < y0 + PH * DPR - 2; yy += step) {
        for (var xx = x0 + 6; xx < x0 + PW * DPR - 2; xx += step) {
          sum += data[(yy * cv.width + xx) * 4 + 3];
        }
      }
      if (pp.ink !== undefined && Math.abs(sum - pp.ink) > 60) changed.push(pp);
      pp.ink = sum;
    }

    return { url: url, changed: changed };
  }

  /* ============ 建 24 块，每块取整幅图上自己那一小片 ============ */
  /* 散落的位置单独排一张「摊开」的网格：先乱序分格子，免得某块恰好待在原位、偷偷透题 */
  var cells = [];
  for (var c0 = 0; c0 < TOTAL; c0++) cells.push(c0);
  for (var s0 = TOTAL - 1; s0 > 0; s0--) {
    var r0 = Math.floor(Math.random() * (s0 + 1));
    var tp = cells[s0]; cells[s0] = cells[r0]; cells[r0] = tp;
  }
  var FIELD_X0 = 40, FIELD_DX = 160;    // 摊开网格：左起 40，横距 160 → 一片正好 920 宽
  var FIELD_Y0 = 106, FIELD_DY = 104;   // 竖距 104 → 一片正好 387 高
  var BOARD_L = (1000 - BW) / 2, BOARD_T = (600 - BH) / 2;

  var pieces = [];
  for (var i = 0; i < TOTAL; i++) {
    var col = i % COLS, row = Math.floor(i / COLS);
    var el = document.createElement('div');
    el.className = 'pc';
    el.style.left = (col * PW) + 'px';
    el.style.top = (row * PH) + 'px';
    el.style.width = PW + 'px';
    el.style.height = PH + 'px';
    el.style.backgroundPosition = '-' + (col * PW) + 'px -' + (row * PH) + 'px';
    el.style.backgroundSize = BW + 'px ' + BH + 'px';
    board.appendChild(el);

    pieces.push({
      el: el, i: i, col: col, row: row,
      /* 散着的时候：摊开一片，各自待的地方、各自的角度（不叠成一堆） */
      lx: (FIELD_X0 + (cells[i] % COLS) * FIELD_DX + (Math.random() - 0.5) * 28) - (BOARD_L + col * PW),
      ly: (FIELD_Y0 + Math.floor(cells[i] / COLS) * FIELD_DY + (Math.random() - 0.5) * 22) - (BOARD_T + row * PH),
      rot: (Math.random() - 0.5) * 32,
      /* 漂移：每块有自己的节奏，不会整齐划一 */
      ax: 6 + Math.random() * 10,
      ay: 5 + Math.random() * 8,
      sp1: 0.20 + Math.random() * 0.30,
      sp2: 0.16 + Math.random() * 0.26,
      ph1: Math.random() * Math.PI * 2,
      ph2: Math.random() * Math.PI * 2,
      /* 归位错峰：从左上一路扫到右下 */
      delay: col * 0.018 + row * 0.06 + Math.random() * 0.045
    });
  }

  function applyImage(url) {
    for (var k = 0; k < pieces.length; k++) {
      pieces[k].el.style.backgroundImage = 'url(' + url + ')';
    }
  }

  /* ============ 开合状态 ============ */
  var open = !!forceOpen;
  var openSince = 0;
  var closeSince = -1e7;   // 一开始就是散着的（别在启动那一瞬先拼一下再散）
  var DUR = 0.95;    // 拼上去用多久
  var CDUR = 0.85;   // 散开用多久
  var TAIL = 1200;   // 余韵：指针走了还留多久
  var closeTimer = null;
  var holdTimer = null;

  var mouse = { x: -9999, y: -9999, inside: false };

  function setOpen(v) {
    if (v === open) return;
    open = v;
    stage.classList.toggle('open', v);
    hintEl.classList.toggle('off', v);
    if (v) { openSince = performance.now(); }
    else { closeSince = performance.now(); }
  }

  function hoverIn() {
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    mouse.inside = true;
    setOpen(true);
  }

  function hoverOut() {
    mouse.inside = false;
    if (holdTimer) return;                 // 手动拼着的时候，别人把指针挪走也不散
    if (closeTimer) clearTimeout(closeTimer);
    closeTimer = setTimeout(function () { closeTimer = null; setOpen(false); }, TAIL);
  }

  stage.addEventListener('pointerenter', hoverIn);
  stage.addEventListener('pointerleave', hoverOut);
  stage.addEventListener('pointermove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.inside = true;
  });

  /* 触屏 / 键盘：没有指针悬停，就点一下让它自己拼 4 秒 */
  function holdOpen() {
    if (forceOpen) return;
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    if (holdTimer) clearTimeout(holdTimer);
    setOpen(true);
    holdTimer = setTimeout(function () { holdTimer = null; setOpen(false); }, 4000);
  }
  stage.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') holdOpen(); });
  stage.addEventListener('click', function () { if (!mouse.inside) holdOpen(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); holdOpen(); }
  });

  /* ============ 主循环 ============ */
  var br = null;        // 盘在屏幕上的位置与缩放，跟着窗口尺寸更新
  function measure() { br = board.getBoundingClientRect(); }

  /* 整块舞台按窗口等比缩放：塞进任何尺寸的窗口 / iframe 都完整，不裁 */
  function fitStage() {
    var s = Math.min(window.innerWidth / 1000, window.innerHeight / 600);
    s = Math.max(0.25, Math.min(1.6, s));
    stage.style.transform = 'scale(' + s.toFixed(4) + ')';
    measure();
  }
  fitStage();
  window.addEventListener('resize', fitStage);

  var frameNo = 0;
  var hourCached = -1;

  function easeInOut(p) {
    return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  }

  function frame(now) {
    var t = now / 1000;
    var d = new Date();
    var hh = ('0' + d.getHours()).slice(-2);
    var mm = ('0' + d.getMinutes()).slice(-2);

    var got = paint(hh, mm);
    if (got) {
      applyImage(got.url);
      /* 这一分钟变了的块：让它当场松开、再咬回去——时间在换，你看得见 */
      var settledNow = forceOpen || (open && (now - openSince) > 1500);
      if (got.changed.length && settledNow && !reduceMotion) {
        for (var ci = 0; ci < got.changed.length; ci++) {
          var cp = got.changed[ci];
          cp.kickAt = now;
          var ang = Math.random() * Math.PI * 2;
          var mag = 24 + Math.random() * 16;
          cp.kdx = Math.cos(ang) * mag;
          cp.kdy = Math.sin(ang) * mag * 0.72;
          cp.krot = (Math.random() - 0.5) * 15;
        }
      }
    }
    dateEl.textContent = d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2) +
      '　' + ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()];

    /* 每秒一下：整盘拼图的缝轻轻亮一次 —— 这就是秒，不需要另加一根进度条 */
    var secTick = reduceMotion ? 0 : Math.max(0, 1 - (d.getMilliseconds() / 1000) * 4.2);

    var hour = d.getHours();
    if (hour !== hourCached) { hourCached = hour; }
    frameNo++;

    var w = 0, h = 0, sk = 1;
    if (br) { w = br.left; h = br.top; sk = br.width / BW; }   // sk = 当前缩放，指针坐标要按它折算

    for (var k = 0; k < pieces.length; k++) {
      var p = pieces[k];

      /* 该拼到几分了：0 = 还散着，1 = 已经咬合 */
      var prog;
      if (reduceMotion || forceOpen) {
        prog = 1;
      } else if (open) {
        prog = (now - openSince) / 1000 - p.delay;
        prog = prog / DUR;
      } else {
        prog = 1 - ((now - closeSince) / 1000 - p.delay) / CDUR;
      }
      prog = Math.max(0, Math.min(1, prog));
      var e = easeInOut(prog);

      /* 漂移：它自己在慢慢挪，像桌上没收拢的东西 */
      var dxd = reduceMotion ? 0 : Math.sin(t * p.sp1 + p.ph1) * p.ax;
      var dyd = reduceMotion ? 0 : Math.cos(t * p.sp2 + p.ph2) * p.ay;

      /* 指针靠近时，还没咬合的块会轻轻躲开（坐标按当前缩放折算回来） */
      var rx = 0, ry = 0;
      if (mouse.inside && e < 0.55) {
        var cx = w + (p.col * PW + PW / 2 + (p.lx + dxd) * (1 - e)) * sk;
        var cy = h + (p.row * PH + PH / 2 + (p.ly + dyd) * (1 - e)) * sk;
        var ddx = cx - mouse.x, ddy = cy - mouse.y;
        var dist = Math.sqrt(ddx * ddx + ddy * ddy);
        var R = 150 * sk;
        if (dist < R && dist > 0.001) {
          var f = (1 - dist / R) * 42 / (sk || 1);   // 力用布局 px 表示，抵消缩放
          rx = (ddx / dist) * f;
          ry = (ddy / dist) * f;
        }
      }

      var offX = (p.lx + dxd + rx) * (1 - e);
      var offY = (p.ly + dyd + ry) * (1 - e);
      var rot = p.rot * (1 - e);
      var sc = 1 - (1 - e) * 0.04;

      /* 这一分钟的块：弹出去、再咬回来（正弦包络，一张一合） */
      if (p.kickAt) {
        var kp = (now - p.kickAt) / 320;
        if (kp >= 1) {
          p.kickAt = 0;
        } else {
          var env = Math.sin(Math.PI * Math.max(0, kp));
          offX += env * p.kdx;
          offY += env * p.kdy;
          rot += env * p.krot;
          sc *= 1 + env * 0.05;
        }
      }

      p.el.style.transform = 'translate3d(' + offX.toFixed(2) + 'px,' + offY.toFixed(2) + 'px,0) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
      p.el.style.opacity = (0.82 + 0.18 * e).toFixed(3);

      /* 缝的亮度 = 一天拼到第几块；每秒整盘缝再亮一下 = 秒 */
      if (frameNo % 3 === 0 || k === 0) {
        var seam;
        if (p.i < hour) {
          seam = 'rgba(140, 228, 255, ' + (0.20 + 0.14 * secTick).toFixed(3) + ')';
        } else if (p.i === hour) {
          var kk = 0.5 + 0.5 * Math.sin(t * 2.0);
          seam = 'rgba(125, 249, 255, ' + (0.24 + 0.22 * kk + 0.22 * secTick).toFixed(3) + ')';
        } else {
          seam = 'rgba(205, 235, 255, ' + (0.05 + 0.10 * secTick + 0.03 * e).toFixed(3) + ')';
        }
        p.el.style.setProperty('--seam', seam);
      }
    }

    requestAnimationFrame(frame);
  }

  hintEl.classList.remove('off');
  if (embedMode) document.body.classList.add('embed');
  if (forceOpen) { hintEl.classList.add('off'); stage.classList.add('open'); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
