<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间表达 ② 文字诗 · 王伯伦原创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #23202e, #0d0c13 72%);
    font-family: Georgia, "Songti SC", "SimSun", serif; overflow: hidden; color: #fff;
  }
  .wrap { text-align: center; max-width: 720px; padding: 20px; }

  /* 诗意主句：随时刻变化的诗句 */
  .poem {
    font-size: 40px; line-height: 1.6; font-weight: 600;
    background: linear-gradient(120deg, #f6e2b5, #e8b8a0 45%, #c9a0e8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 7px; text-shadow: 0 6px 30px rgba(0,0,0,0.3);
    min-height: 3.2em; transition: opacity .6s;
  }
  .poem.fade { opacity: 0; }

  .sub {
    margin-top: 26px; font-size: 15px; letter-spacing: 4px; color: rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums;
  }
  .sub .time { font-size: 20px; color: rgba(255,255,255,0.85); margin-right: 12px; }

  .tag { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,0.32); letter-spacing: 2px; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="poem" id="poem">晨光洒满窗台</div>
    <div class="sub">
      <span class="time" id="time">11:55</span>
      <span id="weekdate">2026/11/12 星期四</span>
    </div>
  </div>

  <div class="tag">时间表达 ② · 文字诗</div>

<script>
  // 按小时变化的诗句（24 段，表达此刻的氛围）
  const POEMS = [
    '子夜时分，万物归于寂静',            // 0
    '深夜渐深，路灯照着归人',            // 1
    '夜色未央，思绪游荡',                // 2
    '凌晨三刻，城市沉睡',                // 3
    '破晓之前，天光微露',                // 4
    '晨光初醒，鸟鸣渐起',                // 5
    '清晨的风，轻抚面庞',                // 6
    '朝霞满天，崭新一天',                // 7
    '晨光正好，咖啡正香',                // 8
    '阳光渐暖，忙碌将启',                // 9
    '午前的光，铺满案头',                // 10
    '日光正好，近午时分',                // 11
    '正午当空，光影最短',                // 12
    '午后微醺，睡意来袭',                // 13
    '午后斜阳，茶香袅袅',                // 14
    '日影西斜，午后将尽',                // 15
    '黄昏渐近，天边染金',                // 16
    '夕阳如火，倦鸟归林',                // 17
    '暮色四合，华灯初上',                // 18
    '夜色初临，万家灯火',                // 19
    '夜渐深沉，星河初现',                // 20
    '深夜时刻，月挂中天',                // 21
    '夜深人静，星光点点',                // 22
    '夜将尽，新一天在酝酿'              // 23
  ];

  const poemEl = document.getElementById('poem');
  const timeEl = document.getElementById('time');
  const wdEl = document.getElementById('weekdate');
  const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  let lastPoemIdx = -1;

  function update(){
    const now = new Date();
    const h = now.getHours();
    // 诗句随小时变化，淡入淡出切换
    if (h !== lastPoemIdx) {
      lastPoemIdx = h;
      poemEl.classList.add('fade');
      setTimeout(() => {
        poemEl.textContent = POEMS[h];
        poemEl.classList.remove('fade');
      }, 600);
    }
    timeEl.textContent = `${String(h).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    wdEl.textContent = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${WEEK[now.getDay()]}`;
  }
  setInterval(update, 1000);
  update();
</script>
</body>
</html>
